[workspace]
resolver = "2"
members = [
    "contracts/snapfall-core",
    "contracts/snapfall-audit",
    "contracts/mock-ft",
    "contracts/withdraw-helper",
    "sandbox-tests",
]

[workspace.dependencies]
near-sdk = { version = "5", default-features = false, features = ["legacy", "wee_alloc"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

